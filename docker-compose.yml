services:
  app:
    build: .
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SUMUP_API_KEY=${SUMUP_API_KEY}
      - SUMUP_MERCHANT_CODE=${SUMUP_MERCHANT_CODE}
      - NEXT_PUBLIC_BASE_URL=${NEXT_PUBLIC_BASE_URL}
      - GMAIL_USER=${GMAIL_USER}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD}
      - EDITOR_EMAIL=${EDITOR_EMAIL}
    volumes:
      - order-data:/app/data
    ports:
      - "3000:3000"

volumes:
  order-data:
